<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Základní webovka</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
    }

    main {
      text-align: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      max-width: 560px;
      width: min(90vw, 560px);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    p {
      line-height: 1.5;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ahoj 👋</h1>
    <p>
      Toto je jednoduchá základní webová stránka hostovaná v tomto repozitáři.
    </p>
  </main>
</body>
</html>
