<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JohnSparky518</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }

      main {
        text-align: center;
        padding: 2rem;
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }

      p {
        margin-bottom: 0;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vítej na mém webu 👋</h1>
      <p>Tahle stránka je základní verze, aby nebyla prázdná.</p>
    </main>
  </body>
</html>
